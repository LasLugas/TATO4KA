<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Для тебя">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<title>Для тебя</title>
<style>
  :root{
    --bg:#14090f;
    --cream:#fff4ef;
    --muted:rgba(255,244,239,.6);
    --rose:#ff5d7d;
    --rose-2:#ffa3b8;
    --line:rgba(255,190,205,.14);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --hand:"Bradley Hand","Segoe Script","Segoe Print","Marker Felt","Comic Sans MS",cursive;
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100%;
    font-family:var(--sans);color:var(--cream);
    background:
      radial-gradient(900px 620px at 50% -8%, rgba(255,86,120,.20), transparent 62%),
      radial-gradient(640px 480px at 100% 105%, rgba(255,140,90,.08), transparent 60%),
      var(--bg);
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit}

  /* ---------- фоновые сердечки ---------- */
  #floaters{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .floater{
    position:absolute;bottom:-8vh;color:var(--rose);opacity:0;
    animation:floatUp linear infinite;will-change:transform,opacity;
  }
  @keyframes floatUp{
    0%{transform:translate3d(0,0,0) rotate(-10deg);opacity:0}
    12%{opacity:var(--o,.16)}
    85%{opacity:var(--o,.16)}
    100%{transform:translate3d(var(--dx,0),-120vh,0) rotate(12deg);opacity:0}
  }

  main{position:relative;z-index:1}

  /* ---------- первый экран ---------- */
  .hero{
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;position:relative;
    padding:calc(28px + env(safe-area-inset-top)) 24px calc(64px + env(safe-area-inset-bottom));
  }
  .heart-wrap{position:relative;display:grid;place-items:center;margin-bottom:24px}
  .heart-glow{
    position:absolute;width:290px;height:290px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,80,115,.36), transparent 62%);
    filter:blur(8px);
  }
  .heart{
    position:relative;width:154px;height:142px;padding:0;border:0;background:none;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .heart svg{
    width:100%;height:100%;display:block;
    animation:beat 2.6s ease-in-out infinite;
    filter:drop-shadow(0 16px 38px rgba(255,60,100,.38));
  }
  @keyframes beat{
    0%,100%{transform:scale(1)}
    12%{transform:scale(1.06)}
    24%{transform:scale(1)}
    36%{transform:scale(1.04)}
    50%{transform:scale(1)}
  }
  .kicker{
    margin:0 0 12px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--rose-2);opacity:.78;
  }
  h1{
    margin:0;font-family:var(--serif);font-weight:500;
    font-size:clamp(30px,8.6vw,42px);line-height:1.16;letter-spacing:-.01em;
  }
  h1 .name{font-style:italic;color:var(--rose-2)}
  .counter{margin:14px 0 0;font-size:15px;line-height:1.5;color:var(--muted)}
  .counter b{color:var(--cream);font-weight:600}
  .scroll-cue{
    position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translateX(-50%);color:var(--muted);font-size:18px;
    animation:cue 1.9s ease-in-out infinite;
  }
  @keyframes cue{
    0%,100%{transform:translate(-50%,0);opacity:.35}
    50%{transform:translate(-50%,6px);opacity:.9}
  }

  /* ---------- карточки ---------- */
  .sections{
    max-width:620px;margin:0 auto;
    padding:0 18px calc(36px + env(safe-area-inset-bottom));
    display:grid;gap:16px;
  }
  .card{
    background:linear-gradient(158deg, rgba(255,255,255,.065), rgba(255,255,255,.022));
    border:1px solid var(--line);border-radius:26px;padding:24px 22px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .card h2{
    margin:0 0 14px;font-family:var(--serif);font-weight:500;
    font-size:19px;letter-spacing:.01em;
  }
  #letter p{
    margin:0 0 13px;font-family:var(--serif);font-size:16.5px;line-height:1.68;
    color:rgba(255,244,239,.9);
  }
  #letter p:last-child{margin-bottom:0}
  .sign{
    margin:18px 0 0;font-family:var(--serif);font-style:italic;
    font-size:15.5px;color:var(--rose-2);
  }
  .ps{
    margin:14px 0 0;font-family:var(--serif);font-style:italic;
    font-size:14.5px;color:var(--muted);
  }
  .label{
    margin:0 0 10px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);
  }
  .reason{
    margin:0 0 20px;font-family:var(--serif);font-style:italic;
    font-size:21px;line-height:1.42;min-height:74px;
    transition:opacity .18s ease, transform .18s ease;
  }
  .reason.is-out{opacity:0;transform:translateY(6px)}
  .hug-text{margin:0 0 18px;font-size:15px;line-height:1.5;color:var(--muted)}

  /* ---------- полароид-кнопка на главной ---------- */
  .card--album{text-align:center}
  .album{
    display:inline-block;text-decoration:none;color:inherit;
    transform:rotate(-2deg);transition:transform .25s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .album:active{transform:rotate(-2deg) scale(.98)}
  @media (hover:hover){.album:hover{transform:rotate(0deg) translateY(-3px)}}
  .album__frame{
    display:block;width:min(232px,62vw);
    background:#f7f2e9;border-radius:3px;padding:11px 11px 0;
    box-shadow:0 20px 44px rgba(0,0,0,.5);
  }
  .album__frame img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#e7ded1}
  .album__placeholder{
    display:grid;place-items:center;width:100%;aspect-ratio:4/5;
    background:linear-gradient(160deg,#f3e6dd,#e7d3c8);color:#d0607a;font-size:42px;
  }
  .album__caption{
    display:block;padding:10px 2px 13px;text-align:center;
    font-family:var(--hand);font-size:14px;color:#3a2e28;
  }
  .btn{
    appearance:none;-webkit-appearance:none;width:100%;cursor:pointer;
    border:1px solid rgba(255,140,165,.35);border-radius:999px;
    background:rgba(255,93,125,.14);color:var(--cream);
    padding:13px 20px;font-size:15px;
    transition:transform .14s ease, background .2s ease;
  }
  .btn:active{transform:scale(.97);background:rgba(255,93,125,.26)}
  footer{
    padding:10px 0 4px;text-align:center;
    color:var(--muted);font-size:11.5px;letter-spacing:.06em;
  }

  /* ---------- модальное окно ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;animation:fadeIn .22s ease}
  .modal[hidden]{display:none}
  .modal__backdrop{position:absolute;inset:0;background:rgba(8,4,7,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .modal__card{
    position:relative;width:100%;max-width:340px;border-radius:26px;padding:26px 22px;
    background:#241019;border:1px solid rgba(255,190,205,.18);
    box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center;
    animation:pop .3s cubic-bezier(.2,1.2,.35,1);
  }
  .modal__card h3{margin:0 0 10px;font-family:var(--serif);font-weight:500;font-size:21px}
  .modal__card p{margin:0 0 20px;font-size:15px;line-height:1.6;color:rgba(255,244,239,.88)}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{transform:scale(.92) translateY(8px);opacity:0}to{transform:none;opacity:1}}

  .spark{position:fixed;z-index:70;pointer-events:none;font-size:16px;line-height:1;will-change:transform,opacity}

  @media (prefers-reduced-motion: reduce){
    .heart svg,.scroll-cue{animation:none}
    #floaters{display:none}
  }
</style>
</head>
<body>
<div id="floaters" aria-hidden="true"></div>

<main>
  <section class="hero">
    <div class="heart-wrap">
      <div class="heart-glow" aria-hidden="true"></div>
      <button class="heart" id="heart" type="button" aria-label="Сердце">
        <svg viewBox="0 0 100 92" role="img" aria-hidden="true">
          <defs>
            <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff9db1"/>
              <stop offset=".55" stop-color="#ff5d7d"/>
              <stop offset="1" stop-color="#dd1c44"/>
            </linearGradient>
          </defs>
          <path d="M50 90 C22 70 4 52 4 32 C4 15 17 4 32 4 C40 4 47 8 50 15 C53 8 60 4 68 4 C83 4 96 15 96 32 C96 52 78 70 50 90 Z" fill="url(#hg)"/>
          <ellipse cx="31" cy="24" rx="12" ry="7" fill="#ffffff" opacity=".16" transform="rotate(-28 31 24)"/>
        </svg>
      </button>
    </div>

    <p class="kicker">только для одного человека</p>
    <h1>Для тебя, <span class="name" id="herName">Любимая</span></h1>
    <p class="counter" id="counter"></p>
    <div class="scroll-cue" aria-hidden="true">↓</div>
  </section>

  <div class="sections">
    <section class="card">
      <h2>Несколько слов</h2>
      <div id="letter"></div>
      <p class="sign" id="sign"></p>
      <p class="ps">P.S. Твой Диктатор — Волшебник.</p>
    </section>

    <section class="card card--album">
      <p class="label">наши кадры</p>
      <a class="album" href="photos.html" aria-label="Открыть фотографии">
        <span class="album__frame">
          <img id="albumCover" alt="Наши фотографии" loading="lazy" hidden>
          <span class="album__placeholder" id="albumPlaceholder">♥</span>
          <span class="album__caption" id="albumCaption">Фотографии</span>
        </span>
      </a>
    </section>

    <section class="card">
      <p class="label">почему ты — моя любимая</p>
      <p class="reason" id="reason" aria-live="polite"></p>
      <button class="btn" id="nextReason" type="button">ещё причина</button>
    </section>

    <section class="card">
      <p class="label">если день не задался</p>
      <p class="hug-text">Просто нажми — у меня для тебя кое-что есть.</p>
      <button class="btn" id="hug" type="button">обнять</button>
    </section>

    <footer>сделано с любовью · <span id="year"></span></footer>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" data-close="1"></div>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button class="btn" type="button" data-close="1">хорошо</button>
  </div>
</div>

<script>
  /* ==========================================================
     НАСТРОЙКИ — меняется только этот блок
     ========================================================== */
  const CONFIG = {
    herName: "Таточка",
    // Дата знакомства в формате "ГГГГ-ММ-ДД". Оставь "" — счётчик просто спрячется.
    startDate: "2026-06-08",
    myName: "тот, кто любит тебя больше всех",

    letter: [
      "{name}, если бы мне кто-то сказал, что обычный день может стать особенным просто потому, что в нём есть ты, — я бы не поверил. А теперь это моя норма.",
      "Спасибо, что ты рядом: за смех над моими шутками (даже плохими), за терпение, когда я зануда, и за то, что умеешь превращать скучные дела в тёплые воспоминания.",
      "Я люблю тебя не только в красивые моменты — с закатами, цветами и правильными словами. Я люблю тебя в очередях, в пробках и в дни, когда всё идёт не по плану.",
      "Эта страница — просто маленький повод сказать это ещё раз. Ты — лучшее, что со мной случилось."
    ],

    reasons: [
      "За то, как ты смеёшься над своими же шутками.",
      "За твои искромётные шутки (Лопата).",
      "За то, что слушаешь так, будто в мире нет ничего важнее.",
      "За твои сонные сообщения по утрам.",
      "За то, как ты радуешься мелочам.",
      "За заботу, которую ты пытаешься не показывать.",
      "За то, что с тобой можно просто молчать.",
      "За твой вкус — в музыке, в людях, в жизни.",
      "За то, как ты держишь меня за руку.",
      "За твоё «я скоро» и «уже выхожу».",
      "За то, что выбираешь меня каждый день.",
      "За твои глаза, когда ты увлечена чем-то.",
      "За то, что ты есть."
    ],

    hugTitle: "Обнимаю крепко",
    hugText: "Если тебе грустно — ты не одна. Я рядом, даже если между нами сейчас километры. Приходи, я всегда за. И даже если не грустно — тоже приходи.",

    secret: "Ты нашла секрет. Вот он: я люблю тебя сильнее, чем показывает этот сайт. А он показывает много."
  };
  /* ========================================================== */

  const $ = (sel, root = document) => root.querySelector(sel);

  document.title = "Для тебя, " + CONFIG.herName;
  $("#herName").textContent = CONFIG.herName;
  $("#sign").textContent = "— " + CONFIG.myName;
  $("#year").textContent = new Date().getFullYear();
  $("#letter").innerHTML = CONFIG.letter
    .map((text) => "<p>" + text.split("{name}").join(CONFIG.herName) + "</p>")
    .join("");

  /* ---------- счётчик дней ---------- */
  function plural(n, one, few, many) {
    const d10 = n % 10;
    const d100 = n % 100;
    if (d10 === 1 && d100 !== 11) return one;
    if (d10 >= 2 && d10 <= 4 && (d100 < 12 || d100 > 14)) return few;
    return many;
  }

  (function showCounter() {
    const el = $("#counter");
    const start = CONFIG.startDate ? new Date(CONFIG.startDate + "T00:00:00") : null;
    if (!start || isNaN(start.getTime())) {
      el.textContent = "и каждый день с тобой — подарок";
      return;
    }
    const days = Math.floor((Date.now() - start.getTime()) / 86400000);
    if (days < 0) {
      el.textContent = "и каждый день с тобой — подарок";
      return;
    }
    el.innerHTML =
      "вместе уже <b>" + days.toLocaleString("ru-RU") + "</b> " +
      plural(days, "день", "дня", "дней");
  })();

  /* ---------- причины ---------- */
  const reasonEl = $("#reason");
  const reasons = CONFIG.reasons;
  let reasonIndex = -1;

  function pickReason(animate) {
    if (!reasons.length) {
      reasonEl.textContent = "Просто потому, что ты — это ты.";
      return;
    }
    let next = Math.floor(Math.random() * reasons.length);
    if (reasons.length > 1) {
      while (next === reasonIndex) next = Math.floor(Math.random() * reasons.length);
    }
    reasonIndex = next;
    if (!animate) {
      reasonEl.textContent = reasons[next];
      return;
    }
    reasonEl.classList.add("is-out");
    setTimeout(() => {
      reasonEl.textContent = reasons[next];
      reasonEl.classList.remove("is-out");
    }, 170);
  }

  pickReason(false);
  $("#nextReason").addEventListener("click", () => pickReason(true));

  /* ---------- модальное окно ---------- */
  const modal = $("#modal");
  const modalTitle = $("#modalTitle");
  const modalText = $("#modalText");
  let lastFocus = null;

  function openModal(title, text) {
    lastFocus = document.activeElement;
    modalTitle.textContent = title;
    modalText.textContent = text;
    modal.hidden = false;
    document.body.style.overflow = "hidden";
    const closeBtn = modal.querySelector("[data-close]");
    if (closeBtn) closeBtn.focus({ preventScroll: true });
  }

  function closeModal() {
    modal.hidden = true;
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  modal.addEventListener("click", (event) => {
    if (event.target && event.target.hasAttribute("data-close")) closeModal();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !modal.hidden) closeModal();
  });

  $("#hug").addEventListener("click", () => openModal(CONFIG.hugTitle, CONFIG.hugText));

  /* ---------- сердечко и искры ---------- */
  function burst(x, y) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < 16; i++) {
      const spark = document.createElement("span");
      spark.className = "spark";
      spark.textContent = i % 4 === 0 ? "♥" : "❤";
      spark.style.left = x + "px";
      spark.style.top = y + "px";
      spark.style.color = i % 3 === 0 ? "#ffa3b8" : "#ff5d7d";
      spark.style.fontSize = 12 + Math.random() * 10 + "px";
      document.body.appendChild(spark);

      const angle = Math.random() * Math.PI * 2;
      const distance = 50 + Math.random() * 120;
      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance - 30;

      const animation = spark.animate(
        [
          { transform: "translate(-50%, -50%) scale(.5)", opacity: 1 },
          {
            transform:
              "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) scale(" +
              (0.7 + Math.random()) + ")",
            opacity: 0
          }
        ],
        { duration: 650 + Math.random() * 550, easing: "cubic-bezier(.15,.7,.3,1)" }
      );
      animation.onfinish = () => spark.remove();
    }
  }

  const heart = $("#heart");
  const taps = [];
  heart.addEventListener("click", () => {
    const rect = heart.getBoundingClientRect();
    burst(rect.left + rect.width / 2, rect.top + rect.height / 2);

    const now = Date.now();
    taps.push(now);
    while (taps.length && now - taps[0] > 2000) taps.shift();
    if (taps.length >= 5) {
      taps.length = 0;
      setTimeout(() => openModal("Секрет", CONFIG.secret), 260);
    }
  });

  /* ---------- обложка альбома ---------- */
  (function loadAlbumCover() {
    const cover = $("#albumCover");
    const caption = $("#albumCaption");
    const placeholder = $("#albumPlaceholder");
    if (!cover) return;
    fetch("photos.json", { cache: "no-cache" })
      .then((response) => (response.ok ? response.json() : Promise.reject(new Error("no manifest"))))
      .then((data) => {
        const photos = data.photos || [];
        const first = photos[0];
        if (!first) return;
        cover.src = first.src;
        cover.alt = first.caption || "Наши фотографии";
        cover.hidden = false;
        if (placeholder) placeholder.hidden = true;
        caption.textContent = "Смотреть все · " + photos.length;
      })
      .catch(() => {});
  })();

  /* ---------- фоновые сердечки ---------- */
  (function createFloaters() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const layer = $("#floaters");
    const symbols = ["❤", "♥", "❥"];
    for (let i = 0; i < 16; i++) {
      const el = document.createElement("span");
      el.className = "floater";
      el.textContent = symbols[i % symbols.length];
      el.style.left = Math.random() * 100 + "%";
      el.style.fontSize = 9 + Math.random() * 12 + "px";
      el.style.setProperty("--o", (0.06 + Math.random() * 0.12).toFixed(2));
      el.style.setProperty("--dx", Math.round(Math.random() * 80 - 40) + "px");
      el.style.animationDuration = 16 + Math.random() * 14 + "s";
      el.style.animationDelay = (-Math.random() * 30).toFixed(1) + "s";
      layer.appendChild(el);
    }
  })();
</script>
</body>
</html>
